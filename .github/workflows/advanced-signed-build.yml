name: Advanced Observability Signed Validation Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-validation-build:
    runs-on: macos-15
    env:
      CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      HOST_PROFILE_BASE64: ${{ secrets.MACOS_HOST_PROVISIONING_PROFILE_BASE64 }}
      EXTENSION_PROFILE_BASE64: ${{ secrets.MACOS_EXTENSION_PROVISIONING_PROFILE_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}

    steps:
      - uses: actions/checkout@v5

      - name: Validate signing inputs
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CERTIFICATE_P12_BASE64 CERTIFICATE_PASSWORD HOST_PROFILE_BASE64 EXTENSION_PROFILE_BASE64 APPLE_TEAM_ID SIGNING_IDENTITY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub secret for $name" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "See docs/advanced-observability-signed-runbook.md before running this workflow." >&2
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install signing certificate and provisioning profiles
        shell: bash
        run: |
          set -euo pipefail

          KEYCHAIN="$RUNNER_TEMP/traffic-monitoring-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERTIFICATE="$RUNNER_TEMP/traffic-monitoring-signing.p12"
          HOST_PROFILE="$RUNNER_TEMP/traffic-monitoring-host.provisionprofile"
          EXTENSION_PROFILE="$RUNNER_TEMP/traffic-monitoring-extension.provisionprofile"

          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE"
          printf '%s' "$HOST_PROFILE_BASE64" | base64 -D > "$HOST_PROFILE"
          printf '%s' "$EXTENSION_PROFILE_BASE64" | base64 -D > "$EXTENSION_PROFILE"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"

          security cms -D -i "$HOST_PROFILE" > "$RUNNER_TEMP/host-profile.plist"
          security cms -D -i "$EXTENSION_PROFILE" > "$RUNNER_TEMP/extension-profile.plist"

          HOST_PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/host-profile.plist")"
          HOST_PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/host-profile.plist")"
          HOST_PROFILE_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/host-profile.plist")"
          EXTENSION_PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/extension-profile.plist")"
          EXTENSION_PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/extension-profile.plist")"
          EXTENSION_PROFILE_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/extension-profile.plist")"

          [[ "$HOST_PROFILE_TEAM" == "$APPLE_TEAM_ID" ]] || { echo "Host profile Team ID does not match APPLE_TEAM_ID" >&2; exit 1; }
          [[ "$EXTENSION_PROFILE_TEAM" == "$APPLE_TEAM_ID" ]] || { echo "Extension profile Team ID does not match APPLE_TEAM_ID" >&2; exit 1; }

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          cp "$HOST_PROFILE" "$PROFILE_DIR/$HOST_PROFILE_UUID.provisionprofile"
          cp "$EXTENSION_PROFILE" "$PROFILE_DIR/$EXTENSION_PROFILE_UUID.provisionprofile"

          security find-identity -v -p codesigning "$KEYCHAIN"

          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "TM_HOST_PROFILE_SPECIFIER=$HOST_PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TM_EXTENSION_PROFILE_SPECIFIER=$EXTENSION_PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build signed validation app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project TrafficMonitoring.xcodeproj \
            -scheme TrafficMonitoring \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath .build/signed-validation \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN" \
            TM_HOST_PROFILE_SPECIFIER="$TM_HOST_PROFILE_SPECIFIER" \
            TM_EXTENSION_PROFILE_SPECIFIER="$TM_EXTENSION_PROFILE_SPECIFIER" \
            build

      - name: Verify signed Advanced Observability bundle
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=".build/signed-validation/Build/Products/Release/TrafficMonitoring.app"
          bash scripts/verify-signed-advanced-observability.sh "$APP_PATH"

      - name: Package signed validation artifact
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH=".build/signed-validation/Build/Products/Release/TrafficMonitoring.app"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" TrafficMonitoring-signed-validation.app.zip
          shasum -a 256 TrafficMonitoring-signed-validation.app.zip > TrafficMonitoring-signed-validation.app.zip.sha256

      - name: Upload signed validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrafficMonitoring-signed-validation-${{ github.run_number }}
          path: |
            TrafficMonitoring-signed-validation.app.zip
            TrafficMonitoring-signed-validation.app.zip.sha256
          if-no-files-found: error
          retention-days: 3

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          if [[ -n "${SIGNING_KEYCHAIN:-}" && -f "$SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
