name: CI

on:
  push:
    branches: [main, "agent/**", "positioning/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  macos-build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Swift core tests
        run: swift test

      - name: Validate Advanced Observability security tooling
        run: |
          set -euo pipefail
          bash -n scripts/verify-signed-advanced-observability.sh
          swiftc scripts/advanced-observability-xpc-probe.swift -o "$RUNNER_TEMP/advanced-observability-xpc-probe"

      - name: Xcode build and tests
        run: |
          set -o pipefail
          xcodebuild \
            -project TrafficMonitoring.xcodeproj \
            -scheme TrafficMonitoring \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build/ci-tests \
            CODE_SIGNING_ALLOWED=NO \
            build test 2>&1 | tee xcodebuild.log

      - name: Build Advanced Observability spike (unsigned)
        run: |
          set -o pipefail
          cd experiments/advanced-observability
          xcodegen generate
          xcodebuild \
            -project TrafficMonitoringAdvancedObservabilitySpike.xcodeproj \
            -scheme AdvancedObservabilitySpike \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath ../../.build/advanced-observability \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee ../../advanced-observability-build.log

      - name: Build clean Release app bundle
        run: |
          set -o pipefail
          xcodebuild \
            -project TrafficMonitoring.xcodeproj \
            -scheme TrafficMonitoring \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath .build/package \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee app-build.log

      - name: Verify Advanced Observability bundle structure
        run: |
          set -euo pipefail
          APP_PATH=".build/package/Build/Products/Release/TrafficMonitoring.app"
          EXT_PATH="$APP_PATH/Contents/Library/SystemExtensions/com.daniele21.trafficmonitoring.filter.systemextension"

          test -d "$APP_PATH"
          test -d "$EXT_PATH"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXT_PATH/Contents/Info.plist")" = "com.daniele21.trafficmonitoring.filter"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NEMachServiceName' "$EXT_PATH/Contents/Info.plist")" = "group.com.daniele21.trafficmonitoring.advanced-observability"
          /usr/libexec/PlistBuddy -c 'Print :NSSystemExtensionUsageDescription' "$APP_PATH/Contents/Info.plist" >/dev/null

      - name: Package runnable macOS app
        run: |
          set -euo pipefail
          APP_PATH=".build/package/Build/Products/Release/TrafficMonitoring.app"
          ARCHIVE_PATH="TrafficMonitoring.app.zip"

          # CI has no production Developer ID / Network Extension provisioning.
          # Ad-hoc signing keeps the core development app runnable but does not
          # pretend Advanced Observability can be activated with this artifact.
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ARCHIVE_PATH"
          shasum -a 256 "$ARCHIVE_PATH" > TrafficMonitoring.app.zip.sha256

      - name: Upload runnable macOS app
        uses: actions/upload-artifact@v4
        with:
          name: TrafficMonitoring-macOS
          path: |
            TrafficMonitoring.app.zip
            TrafficMonitoring.app.zip.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: |
            xcodebuild.log
            app-build.log
            advanced-observability-build.log
          if-no-files-found: ignore
          retention-days: 7
