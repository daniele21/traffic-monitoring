name: TrafficMonitoringAdvancedObservabilitySpike
options:
  minimumXcodeGenVersion: 2.41.0
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.0"

targets:
  TrafficMonitoringFilterDataProvider:
    type: system-extension
    platform: macOS
    sources:
      - path: Sources/FilterDataProvider.swift
    dependencies:
      - sdk: NetworkExtension.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daniele21.trafficmonitoring.experimental.filter
        PRODUCT_NAME: TrafficMonitoringFilterDataProvider
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: TrafficMonitoringFilterExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

schemes:
  AdvancedObservabilitySpike:
    build:
      targets:
        TrafficMonitoringFilterDataProvider: all
